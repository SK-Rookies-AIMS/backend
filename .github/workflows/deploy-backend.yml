name: Build Backend and Update GitOps

on:
  push:
    branches: ["dev", "main"]
    paths:
      - "src/**"
      - "build.gradle"
      - "build.gradle.kts"
      - "settings.gradle"
      - "settings.gradle.kts"
      - "gradlew"
      - "gradle/**"
      - "pom.xml"
      - "Dockerfile"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref_name }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  EKS_CLUSTER_NAME: aims-dev-eks
  ECR_REPOSITORY: aims/backend
  NAMESPACE: aims-project
  BACKEND_CONTEXT: .
  INFRA_REPOSITORY: SK-Rookies-AIMS/infra
  INFRA_MANIFEST_PATH: k8s/backend/backend.yaml

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout backend repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null 2>&1 || aws ecr create-repository --repository-name "$ECR_REPOSITORY" --region "$AWS_REGION" --image-scanning-configuration scanOnPush=true --image-tag-mutability MUTABLE

      - name: Build and push Docker image
        id: build-image
        run: |
          IMAGE_TAG="${GITHUB_REF_NAME}-${GITHUB_SHA::12}"
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          BRANCH_IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_REF_NAME}"

          docker build -t "$IMAGE_URI" -t "$BRANCH_IMAGE_URI" "$BACKEND_CONTEXT"
          docker push "$IMAGE_URI"
          docker push "$BRANCH_IMAGE_URI"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Checkout infra repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPOSITORY }}
          ref: ${{ github.ref_name }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra
          fetch-depth: 0

      - name: Update kubeconfig and ensure namespace
        if: github.ref_name == 'dev'
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Load backend runtime parameters from SSM
        if: github.ref_name == 'dev'
        run: |
          RDS_SECRET_ARN=$(aws ssm get-parameter --name "/aims/dev/rds/secret-arn" --region "$AWS_REGION" --query "Parameter.Value" --output text)
          RDS_HOST=$(aws ssm get-parameter --name "/aims/dev/backend/rds-host" --region "$AWS_REGION" --query "Parameter.Value" --output text)
          RDS_PORT=$(aws ssm get-parameter --name "/aims/dev/backend/rds-port" --region "$AWS_REGION" --query "Parameter.Value" --output text)
          MAIN_DB_NAME=$(aws ssm get-parameter --name "/aims/dev/backend/main-db-name" --region "$AWS_REGION" --query "Parameter.Value" --output text)
          SAMPLE_DB_NAME=$(aws ssm get-parameter --name "/aims/dev/backend/sample-db-name" --region "$AWS_REGION" --query "Parameter.Value" --output text)
          JWT_SECRET_KEY=$(aws ssm get-parameter --name "/aims/dev/backend/jwt-secret-key" --region "$AWS_REGION" --with-decryption --query "Parameter.Value" --output text)

          for VALUE in "$RDS_SECRET_ARN" "$RDS_HOST" "$RDS_PORT" "$MAIN_DB_NAME" "$SAMPLE_DB_NAME" "$JWT_SECRET_KEY"; do
            if [ -z "$VALUE" ] || [ "$VALUE" = "None" ]; then
              echo "Required backend SSM parameter is empty"
              exit 1
            fi
          done

          echo "::add-mask::$RDS_SECRET_ARN"
          echo "::add-mask::$JWT_SECRET_KEY"

          echo "RDS_SECRET_ARN=$RDS_SECRET_ARN" >> "$GITHUB_ENV"
          echo "RDS_HOST=$RDS_HOST" >> "$GITHUB_ENV"
          echo "RDS_PORT=$RDS_PORT" >> "$GITHUB_ENV"
          echo "MAIN_DB_NAME=$MAIN_DB_NAME" >> "$GITHUB_ENV"
          echo "SAMPLE_DB_NAME=$SAMPLE_DB_NAME" >> "$GITHUB_ENV"
          echo "JWT_SECRET_KEY=$JWT_SECRET_KEY" >> "$GITHUB_ENV"

      - name: Create or update backend Kubernetes Secret
        if: github.ref_name == 'dev'
        run: |
          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "$RDS_SECRET_ARN" --region "$AWS_REGION" --query "SecretString" --output text)

          DB_USERNAME=$(echo "$SECRET_JSON" | jq -r '.username')
          DB_PASSWORD=$(echo "$SECRET_JSON" | jq -r '.password')

          if [ -z "$DB_USERNAME" ] || [ "$DB_USERNAME" = "null" ] || [ -z "$DB_PASSWORD" ] || [ "$DB_PASSWORD" = "null" ]; then
            echo "RDS username or password is missing"
            exit 1
          fi

          MAIN_DB_JDBC_URL="jdbc:mysql://$RDS_HOST:$RDS_PORT/$MAIN_DB_NAME?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
          SAMPLE_DB_JDBC_URL="jdbc:mysql://$RDS_HOST:$RDS_PORT/$SAMPLE_DB_NAME?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8"

          echo "::add-mask::$DB_USERNAME"
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$MAIN_DB_JDBC_URL"
          echo "::add-mask::$SAMPLE_DB_JDBC_URL"

          kubectl create secret generic backend-rds-secret -n "$NAMESPACE" --from-literal=MAIN_DB_JDBC_URL="$MAIN_DB_JDBC_URL" --from-literal=MAIN_DB_USERNAME="$DB_USERNAME" --from-literal=MAIN_DB_PASSWORD="$DB_PASSWORD" --from-literal=SAMPLE_DB_JDBC_URL="$SAMPLE_DB_JDBC_URL" --from-literal=SAMPLE_DB_USERNAME="$DB_USERNAME" --from-literal=SAMPLE_DB_PASSWORD="$DB_PASSWORD" --from-literal=JWT_SECRET_KEY="$JWT_SECRET_KEY" --dry-run=client -o yaml | kubectl apply -f -

      - name: Update backend image in GitOps repository
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
        run: |
          MANIFEST="infra/${INFRA_MANIFEST_PATH}"

          test -f "$MANIFEST"
          sed -i -E "s|^([[:space:]]*)image:.*$|\1image: ${IMAGE_URI}|" "$MANIFEST"
          grep -n "image:" "$MANIFEST"

          cd infra

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$INFRA_MANIFEST_PATH"

          if git diff --cached --quiet; then
            echo "Image tag is already up to date"
            exit 0
          fi

          git commit -m "chore(backend): deploy ${GITHUB_REF_NAME}-${GITHUB_SHA::12}"

          for ATTEMPT in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"

            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi

            sleep $((ATTEMPT * 5))
          done

          echo "Failed to push GitOps image update"
          exit 1