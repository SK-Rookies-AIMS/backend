name: Build Backend and Update GitOps

on:
  push:
    branches: ["dev", "main"]
    paths:
      - "src/**"
      - "build.gradle"
      - "build.gradle.kts"
      - "settings.gradle"
      - "settings.gradle.kts"
      - "gradlew"
      - "gradle/**"
      - "pom.xml"
      - "Dockerfile"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-gitops-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  EKS_CLUSTER_NAME: aims-dev-eks
  ECR_REPOSITORY: aims/backend
  NAMESPACE: aims-project
  BACKEND_CONTEXT: .

  INFRA_REPOSITORY: SK-Rookies-AIMS/infra
  INFRA_BRANCH: dev
  INFRA_MANIFEST_PATH: k8s/backend/kustomization.yaml

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout backend repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          set -euo pipefail

          if ! aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            > /dev/null 2>&1; then

            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --region "$AWS_REGION" \
              --image-scanning-configuration scanOnPush=true \
              --image-tag-mutability MUTABLE
          fi

      - name: Build and push Docker image
        id: build-image
        run: |
          set -euo pipefail

          IMAGE_TAG="${GITHUB_REF_NAME}-${GITHUB_SHA::12}"
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          BRANCH_IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_REF_NAME}"

          echo "Building image: $IMAGE_URI"

          docker build \
            -t "$IMAGE_URI" \
            -t "$BRANCH_IMAGE_URI" \
            "$BACKEND_CONTEXT"

          docker push "$IMAGE_URI"
          docker push "$BRANCH_IMAGE_URI"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout infra repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPOSITORY }}
          ref: ${{ env.INFRA_BRANCH }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra
          fetch-depth: 0

      - name: Update kubeconfig and ensure namespace
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

          kubectl create namespace "$NAMESPACE" \
            --dry-run=client \
            -o yaml |
          kubectl apply -f -

      - name: Load backend runtime parameters from SSM
        run: |
          set -euo pipefail

          RDS_SECRET_ARN=$(aws ssm get-parameter \
            --name "/aims/dev/rds/secret-arn" \
            --region "$AWS_REGION" \
            --query "Parameter.Value" \
            --output text)

          RDS_HOST=$(aws ssm get-parameter \
            --name "/aims/dev/backend/rds-host" \
            --region "$AWS_REGION" \
            --query "Parameter.Value" \
            --output text)

          RDS_PORT=$(aws ssm get-parameter \
            --name "/aims/dev/backend/rds-port" \
            --region "$AWS_REGION" \
            --query "Parameter.Value" \
            --output text)

          MAIN_DB_NAME=$(aws ssm get-parameter \
            --name "/aims/dev/backend/main-db-name" \
            --region "$AWS_REGION" \
            --query "Parameter.Value" \
            --output text)

          SAMPLE_DB_NAME=$(aws ssm get-parameter \
            --name "/aims/dev/backend/sample-db-name" \
            --region "$AWS_REGION" \
            --query "Parameter.Value" \
            --output text)

          JWT_SECRET_KEY=$(aws ssm get-parameter \
            --name "/aims/dev/backend/jwt-secret-key" \
            --region "$AWS_REGION" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          REDIS_HOST=$(aws ssm get-parameter \
            --name "/aims/dev/redis/host" \
            --region "$AWS_REGION" \
            --query "Parameter.Value" \
            --output text)

          REDIS_PORT=$(aws ssm get-parameter \
            --name "/aims/dev/redis/port" \
            --region "$AWS_REGION" \
            --query "Parameter.Value" \
            --output text)
          
          KAFKA_BOOTSTRAP_SERVER_1=$(aws ssm get-parameter \
          --name "/aims/dev/msk/bootstrap-server-1" \
          --region "$AWS_REGION" \
          --query "Parameter.Value" \
          --output text)
          
          
          KAFKA_BOOTSTRAP_SERVER_2=$(aws ssm get-parameter \
          --name "/aims/dev/msk/bootstrap-server-2" \
          --region "$AWS_REGION" \
          --query "Parameter.Value" \
          --output text)
          
          for VALUE in \
            "$RDS_SECRET_ARN" \
            "$RDS_HOST" \
            "$RDS_PORT" \
            "$MAIN_DB_NAME" \
            "$SAMPLE_DB_NAME" \
            "$JWT_SECRET_KEY" \
            "$REDIS_HOST" \
            "$REDIS_PORT" \
            "$KAFKA_BOOTSTRAP_SERVER_1" \
            "$KAFKA_BOOTSTRAP_SERVER_2"; do

            if [ -z "$VALUE" ] || [ "$VALUE" = "None" ]; then
              echo "Required backend SSM parameter is empty"
              exit 1
            fi
          done

          echo "::add-mask::$RDS_SECRET_ARN"
          echo "::add-mask::$JWT_SECRET_KEY"

          echo "RDS_SECRET_ARN=$RDS_SECRET_ARN" >> "$GITHUB_ENV"
          echo "RDS_HOST=$RDS_HOST" >> "$GITHUB_ENV"
          echo "RDS_PORT=$RDS_PORT" >> "$GITHUB_ENV"
          echo "MAIN_DB_NAME=$MAIN_DB_NAME" >> "$GITHUB_ENV"
          echo "SAMPLE_DB_NAME=$SAMPLE_DB_NAME" >> "$GITHUB_ENV"
          echo "JWT_SECRET_KEY=$JWT_SECRET_KEY" >> "$GITHUB_ENV"
          echo "REDIS_HOST=$REDIS_HOST" >> "$GITHUB_ENV"
          echo "REDIS_PORT=$REDIS_PORT" >> "$GITHUB_ENV"
          echo "KAFKA_BOOTSTRAP_SERVER_1=$KAFKA_BOOTSTRAP_SERVER_1" >> "$GITHUB_ENV"
          echo "KAFKA_BOOTSTRAP_SERVER_2=$KAFKA_BOOTSTRAP_SERVER_2" >> "$GITHUB_ENV"

      - name: Create or update backend Kubernetes Secret
        run: |
          set -euo pipefail

          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "$RDS_SECRET_ARN" \
            --region "$AWS_REGION" \
            --query "SecretString" \
            --output text)

          DB_USERNAME=$(echo "$SECRET_JSON" | jq -r ".username")
          DB_PASSWORD=$(echo "$SECRET_JSON" | jq -r ".password")

          if [ -z "$DB_USERNAME" ] || [ "$DB_USERNAME" = "null" ]; then
            echo "RDS username is missing"
            exit 1
          fi

          if [ -z "$DB_PASSWORD" ] || [ "$DB_PASSWORD" = "null" ]; then
            echo "RDS password is missing"
            exit 1
          fi

          MAIN_DB_JDBC_URL="jdbc:mysql://$RDS_HOST:$RDS_PORT/$MAIN_DB_NAME?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8"

          SAMPLE_DB_JDBC_URL="jdbc:mysql://$RDS_HOST:$RDS_PORT/$SAMPLE_DB_NAME?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8"

          echo "::add-mask::$DB_USERNAME"
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$MAIN_DB_JDBC_URL"
          echo "::add-mask::$SAMPLE_DB_JDBC_URL"

          kubectl create secret generic backend-rds-secret \
            --namespace "$NAMESPACE" \
            --from-literal=MAIN_DB_JDBC_URL="$MAIN_DB_JDBC_URL" \
            --from-literal=MAIN_DB_USERNAME="$DB_USERNAME" \
            --from-literal=MAIN_DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=SAMPLE_DB_JDBC_URL="$SAMPLE_DB_JDBC_URL" \
            --from-literal=SAMPLE_DB_USERNAME="$DB_USERNAME" \
            --from-literal=SAMPLE_DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=JWT_SECRET_KEY="$JWT_SECRET_KEY" \
            --from-literal=REDIS_HOST="$REDIS_HOST" \
            --from-literal=REDIS_PORT="$REDIS_PORT" \
            --from-literal=KAFKA_BOOTSTRAP_SERVER_1="$KAFKA_BOOTSTRAP_SERVER_2" \
            --from-literal=KAFKA_BOOTSTRAP_SERVER_2="$KAFKA_BOOTSTRAP_SERVER_2" \
            --dry-run=client \
            -o yaml |
          kubectl apply -f -

      - name: Update backend image in GitOps repository
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
        run: |
          set -euo pipefail

          MANIFEST="infra/${INFRA_MANIFEST_PATH}"

          if [ ! -f "$MANIFEST" ]; then
            echo "Manifest file not found: $MANIFEST"
            exit 1
          fi

          IMAGE_TAG="${IMAGE_URI##*:}"
          IMAGE_NAME="${IMAGE_URI%:*}"
          TEMP_FILE="${MANIFEST}.tmp"

          echo "Manifest: $MANIFEST"
          echo "Image name: $IMAGE_NAME"
          echo "Image tag: $IMAGE_TAG"

          awk \
            -v image_name="$IMAGE_NAME" \
            -v image_tag="$IMAGE_TAG" \
            '
            BEGIN {
              in_target = 0
              updated = 0
            }

            {
              if ($1 == "-" && $2 == "name:") {
                in_target = ($3 == image_name)
              }

              if (in_target && $1 == "newTag:") {
                match($0, /^[[:space:]]*/)
                indent = substr($0, 1, RLENGTH)

                print indent "newTag: " image_tag

                updated = 1
                in_target = 0
                next
              }

              print
            }

            END {
              if (!updated) {
                print "Backend image block or newTag was not found" > "/dev/stderr"
                exit 42
              }
            }
            ' \
            "$MANIFEST" > "$TEMP_FILE"

          mv "$TEMP_FILE" "$MANIFEST"

          echo "Updated backend image:"
          grep -n -A 2 -B 1 "$IMAGE_NAME" "$MANIFEST"

          cd infra

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$INFRA_MANIFEST_PATH"

          if git diff --cached --quiet; then
            echo "Image tag is already up to date"
            exit 0
          fi

          git diff --cached

          git commit \
            -m "chore(backend): deploy ${GITHUB_REF_NAME}-${GITHUB_SHA::12}"

          for ATTEMPT in 1 2 3; do
            echo "GitOps push attempt: $ATTEMPT"

            git pull --rebase origin "$INFRA_BRANCH"

            if git push origin "HEAD:$INFRA_BRANCH"; then
              echo "GitOps image update pushed successfully"
              exit 0
            fi

            sleep $((ATTEMPT * 5))
          done

          echo "Failed to push GitOps image update"
          exit 1