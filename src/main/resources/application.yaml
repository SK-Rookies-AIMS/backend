server:
  port: 8081

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ${APP_NAME:backend}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cache:
    type: redis
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: aims-dev-redis.80mdpk.ng.0001.apn2.cache.amazonaws.com
      port: 6379
      timeout: ${REDIS_TIMEOUT:3s}
  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: AWS_MSK_IAM
      sasl.jaas.config: software.amazon.msk.auth.iam.IAMLoginModule required;
      sasl.client.callback.handler.class: software.amazon.msk.auth.iam.IAMClientCallbackHandler

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    consumer:
      group-id: ${KAFKA_GROUP_ID:main-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: true
    kafka:
      enabled: false

app:
  datasource:
    main:
      driver-class-name: ${MAIN_DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
      jdbc-url: ${MAIN_DB_JDBC_URL:jdbc:mysql://localhost:3306/maindb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
      username: ${MAIN_DB_USERNAME:admin}
      password: ${MAIN_DB_PASSWORD:change}
      maximum-pool-size: ${MAIN_DB_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${MAIN_DB_MINIMUM_IDLE:2}
      pool-name: ${MAIN_DB_POOL_NAME:main-db-pool}
    sample:
      driver-class-name: ${SAMPLE_DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
      jdbc-url: ${SAMPLE_DB_JDBC_URL:jdbc:mysql://localhost:3306/sampledb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
      username: ${SAMPLE_DB_USERNAME:admin}
      password: ${SAMPLE_DB_PASSWORD:change}
      maximum-pool-size: ${SAMPLE_DB_MAXIMUM_POOL_SIZE:5}
      minimum-idle: ${SAMPLE_DB_MINIMUM_IDLE:1}
      pool-name: ${SAMPLE_DB_POOL_NAME:sample-db-pool}
  agv:
    dispatch-scheduler:
      enabled: true
      fixed-delay-ms: 1000

    transport-scheduler:
      enabled: true
      fixed-delay-ms: 1000
  redis:
    cache:
      ttl: ${REDIS_CACHE_TTL:10m}
  opensearch:
    scheme: ${OPENSEARCH_SCHEME:http}
    host: ${OPENSEARCH_HOST:localhost}
    port: ${OPENSEARCH_PORT:9200}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    group-id: ${KAFKA_GROUP_ID:main-dev}
    auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
    listeners-enabled: ${KAFKA_LISTENERS_ENABLED:true}
    analysis-topic: factory.manufacturing.analysis

    consumer:
      agv-group-id: ${AGV_CONSUMER_GROUP_ID:main-agv-group}

    security-protocol: SASL_SSL
    sasl-mechanism: AWS_MSK_IAM
    sasl-jaas-config: software.amazon.msk.auth.iam.IAMLoginModule required;
    sasl-client-callback-handler-class: software.amazon.msk.auth.iam.IAMClientCallbackHandler

logging:
  config: classpath:logback-spring.xml

jwt:
  secret-key: ${JWT_SECRET_KEY:assembly-service-local-jwt-secret-key-must-be-at-least-32-bytes}
  expiration:
    access: ${JWT_ACCESS_EXPIRATION:3600000}
    refresh: ${JWT_REFRESH_EXPIRATION:1209600000}

external:
  assembly-url: ${ASSEMBLY_SERVICE_URL:http://localhost:8082}
