logging:
  level:
    root: info
    com.aims.assembly: debug
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
  file:
    path: ${LOG_PATH:logs/local}

management:
  health:
    redis:
      enabled: true
    kafka:
      enabled: false

cors:
  allowedOrigins:
    - http://localhost:5173
