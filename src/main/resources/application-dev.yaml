spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:3s}

  # Spring Boot 자동 설정이 참조할 Kafka 주소
  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVER_1}
      - ${KAFKA_BOOTSTRAP_SERVER_2}


app:
  redis:
    cache:
      ttl: ${REDIS_CACHE_TTL:10m}

  opensearch:
    scheme: ${OPENSEARCH_SCHEME:http}
    host: ${OPENSEARCH_HOST:localhost}
    port: ${OPENSEARCH_PORT:9200}

  # Backend의 KafkaConfig.java가 실제로 읽는 설정
  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVER_1}
      - ${KAFKA_BOOTSTRAP_SERVER_2}

    group-id: ${KAFKA_GROUP_ID:main-dev}
    auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:earliest}
    listeners-enabled: ${KAFKA_LISTENERS_ENABLED:true}

    consumer:
      agv-group-id: ${AGV_CONSUMER_GROUP_ID:main-agv-group}


logging:
  level:
    root: info
    com.aims.backend: debug
    org.hibernate.SQL: debug


management:
  health:
    redis:
      enabled: true
    kafka:
      enabled: false